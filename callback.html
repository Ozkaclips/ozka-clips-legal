<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Autorización · Authorization — Ozka Clips</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; color: #1a1a1a; background: #fff; }
  h1 { font-size: 1.5rem; }
  textarea { width: 100%; height: 7rem; font-family: monospace; }
  button { padding: .5rem 1rem; margin-top: .5rem; }
  @media (prefers-color-scheme: dark) { body { color: #e8e8e8; background: #161616; } textarea { background: #222; color: #e8e8e8; } }
</style>
</head>
<body>
<h1>Ozka Clips — Autorización / Authorization</h1>
<p id="msg"></p>
<textarea id="out" readonly hidden></textarea>
<button id="copy" hidden>Copiar / Copy</button>
<p><small>No compartas este código con nadie. / Do not share this code with anyone.</small></p>
<script>
  var p = new URLSearchParams(location.search);
  var msg = document.getElementById('msg');
  var out = document.getElementById('out');
  var btn = document.getElementById('copy');
  if (p.get('error')) {
    msg.textContent = 'Error: ' + p.get('error') + (p.get('error_description') ? ' — ' + p.get('error_description') : '');
  } else if (p.get('code')) {
    msg.textContent = 'Copia este código y pégalo en el programa. / Copy this code and paste it into the program.';
    out.value = p.get('code');
    out.hidden = false;
    btn.hidden = false;
    btn.onclick = function () { out.select(); document.execCommand('copy'); };
  } else {
    msg.textContent = 'Esta página recibe el resultado de la autorización. / This page receives the authorization result.';
  }
</script>
</body>
</html>
